name: LinkedIn Job Bot

on:
  schedule:
    - cron: '0 0,12,18 * * *'  # 9h, 15h e 21h de Brasília (12h, 18h e 0h UTC) todo dia
  workflow_dispatch:           # permite rodar manualmente pelo GitHub
  push:
    branches: [claude/telegram-job-listings-issue-BYQIt]  # temporário: teste

permissions:
  contents: read
  actions: write   # necessário para o keepalive abaixo

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      # O GitHub desativa workflows agendados após 60 dias sem atividade no repo.
      # Reativar o workflow via API a cada run reinicia esse contador.
      - name: Keepalive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/bot.yml/enable"


      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      # Restaura o banco de vagas já vistas do run anterior (evita reenviar duplicatas).
      # Cada run grava um cache com chave única; restore-keys pega o mais recente.
      - name: Restore jobs database
        uses: actions/cache/restore@v4
        with:
          path: data/jobs.db
          key: jobs-db-${{ github.run_id }}
          restore-keys: |
            jobs-db-

      - name: Run bot
        env:
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
          LI_EMAIL:          ${{ secrets.LI_EMAIL }}
          LI_PASSWORD:       ${{ secrets.LI_PASSWORD }}
          LI_AT_COOKIE:      ${{ secrets.LI_AT_COOKIE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run python main.py --once

      # Persiste o banco atualizado para o próximo run (mesmo se o bot falhar).
      - name: Save jobs database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/jobs.db
          key: jobs-db-${{ github.run_id }}
